# The workflows' actions, kept current once a month in one pull request. Rust and npm
# dependencies are updated by hand with the release that needs them (no version updates:
# open-pull-requests-limit 0); GitHub's security updates still open a pull request at once for
# any with a known vulnerability, one per ecosystem with all its fixes in it rather than one a
# package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "Security"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "Security"
