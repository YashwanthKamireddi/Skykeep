# The in-app updater's signatures, made apart from every build. A build runs the repository's
# own code and everything it pulls in (npm packages and their scripts, build.rs files, proc
# macros), so the signing key is never in a build's environment: the build uploads its bundles
# unsigned, and this job — which runs nothing from the repository and installs no dependency —
# signs them with Tauri's own signer and puts the artifact back under the same name, each file
# with its .sig beside it, as `tauri build` with createUpdaterArtifacts wrote them before.
#
# The signer is @tauri-apps/cli at the version package-lock.json pins, fetched as its two
# registry tarballs (the CLI and its Linux x64 native part) and checked against the integrity
# hashes the lock file records — no `npm install`, so no install script ever runs. Bumping the
# CLI: copy the new version and both `integrity` values from package-lock.json here.
#
# Each signature is bound to the app's version (--app-version, as `tauri build` binds it): the
# app is built with plugins.updater.requireSignedVersion, so an update whose latest.json names
# another version than the one signed is refused.
#
# Called by appimage.yml and windows.yml when they build for the updater.
name: Sign for the updater

on:
  workflow_call:
    inputs:
      # The build's artifact: downloaded, signed, and uploaded again under this name.
      artifact:
        type: string
        required: true
      # The files to sign inside it, as shell globs from its root; each must match one file.
      files:
        type: string
        required: true
      # The commit the bundles were built from, for the version they were built as.
      ref:
        type: string
        default: ""
    secrets:
      # Not marked required, so a caller without it fails below with a plain message.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.12.4"
  TAURI_CLI_INTEGRITY: sha512-JI9bHfudSRJikGOrjbXEm6RjzzvmKuLc+JixB1NE8hNzQkNlCCIC3pTES3uypkR9lxHrsbxzcnSwhI2IxBQphw==
  TAURI_CLI_LINUX_X64_INTEGRITY: sha512-tNzZSa79Z1nRpHxEpQ38lsAFpKlFlYvoXzjTV+lRRn/zSf3wrdUC3wnLcq2XEadchPu4ttK0zivhYzr+XGD19Q==

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only the app's config, read as data for its version: nothing of the repository runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The signer, pinned by hash
        run: |
          dir="$RUNNER_TEMP/signer"
          mkdir -p "$dir/node_modules/@tauri-apps/cli" "$dir/node_modules/@tauri-apps/cli-linux-x64-gnu"
          fetch() { # fetch <package> <tarball name> <integrity>
            local tgz="$RUNNER_TEMP/$2-$TAURI_CLI_VERSION.tgz"
            curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
              "https://registry.npmjs.org/@tauri-apps/$1/-/$2-$TAURI_CLI_VERSION.tgz"
            got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$got" != "$3" ]; then echo "::error::@tauri-apps/$1 $TAURI_CLI_VERSION is not the one pinned ($got)"; exit 1; fi
            tar -xzf "$tgz" -C "$dir/node_modules/@tauri-apps/$1" --strip-components=1
          }
          fetch cli cli "$TAURI_CLI_INTEGRITY"
          fetch cli-linux-x64-gnu cli-linux-x64-gnu "$TAURI_CLI_LINUX_X64_INTEGRITY"
          node "$dir/node_modules/@tauri-apps/cli/tauri.js" --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: bundle
      - name: Sign
        env:
          FILES: ${{ inputs.files }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::signing for the updater needs the TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
          version=$(jq -r .version source/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tauri.conf.json's version is '$version', not a version number"
            exit 1
          fi
          signer="$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js"
          cd bundle
          # Split into patterns first, unexpanded: a pattern matching nothing must fail below,
          # not vanish from the list.
          read -ra patterns <<<"$FILES"
          shopt -s nullglob
          for pattern in "${patterns[@]}"; do
            # shellcheck disable=SC2206 # the pattern is a glob, meant to expand
            found=($pattern)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected one file for '$pattern', found ${#found[@]}: ${found[*]}"
              exit 1
            fi
            node "$signer" signer sign --app-version "$version" "${found[0]}" >/dev/null
            [ -s "${found[0]}.sig" ]
            echo "signed ${found[0]} for $version"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: bundle
          overwrite: true
          if-no-files-found: error
