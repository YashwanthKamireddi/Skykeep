# Windows, checked on every push to main, so a commit is ready to release the moment it is green:
#   windows — the whole Windows pipeline (windows.yml): its tests, the Explorer test, the .msi and
#             the .exe signed for the updater, the .exe installed and started;
#   msix    — the Store package packed from that same build and installed (msix.yml, prebuilt):
#             one Windows build, both checks.
# A release is tagged only on a commit whose CI and Windows checks both succeeded (by its SHA).
# Every commit keeps its own run (grouped by SHA): a newer push never cancels the run a release
# candidate is waiting on (10 Nov: pushing after a tag cancelled 0.1.20's run).
name: Windows checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
      - "packaging/arch/**"
      - "packaging/aur/**"
      - "packaging/copr/**"
      - "packaging/flatpak/**"
      - ".uiverify/**"
  # By hand, on any branch: the same two checks.
  workflow_dispatch:
  # Every Monday, a full build and test of everything, so a tool that changed or a system past
  # its end of life shows up mid-week, never on release day.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: windows-checks-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Signed for the in-app updater here, once: a release of this commit publishes these very
  # installers (release.yml promotes them) instead of building Windows a second time.
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      test_first: true
      updater: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  msix:
    needs: windows
    uses: ./.github/workflows/msix.yml
    with:
      prebuilt: true
