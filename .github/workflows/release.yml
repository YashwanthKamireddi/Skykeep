# A release, from one tag: `git tag v0.2.0 && git push origin v0.2.0`.
#   appimage — the .AppImage, built in an Ubuntu 22.04 container (appimage.yml), so it runs on
#             22.04 and everything newer; nothing in it may need more than 22.04's glibc 2.35;
#   linux   — .deb and .rpm, built on Ubuntu 24.04 (its libheif is new enough). None is kept
#             unless it runs: the .deb is installed on the build machine and started headless
#             under Xvfb; the .rpm is installed with dnf in a clean Fedora 41 container and
#             started the same way; the .AppImage is started with --appimage-extract-and-run
#             (no FUSE needed) after the .deb is removed, then with no network at all in clean
#             Ubuntu 22.04 and Fedora 41 containers, as the AppImage catalog starts it.
#             "Started" means the program is still running some seconds later — not merely
#             that it links;
#   windows — the Windows pipeline (windows.yml): its tests, the .msi and .exe, the smoke test;
#             or, when the commit's Windows checks already did all that, their signed installers;
#   publish — every file in one draft release with its checksums, for a person to read over
#             and publish. Nothing is published by itself. Each installer is also attached
#             under a name without the version (Skykeep-linux-amd64.deb and so on), which is
#             what the README's releases/latest/download/ links point at.
#
# The in-app updater (src-tauri/src/updates.rs) reads `latest.json` from the latest published
# release. Each build signs what it can update — the AppImage, the .exe and the .msi — with
# the TAURI_SIGNING_PRIVATE_KEY secret (createUpdaterArtifacts: a .sig beside each, with the
# version signed into it); publish writes latest.json from those signatures. The .deb and .rpm
# are updated by package managers, so they are not in it. A draft is invisible to the updater
# until it is published.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from a branch: everything built and started, nothing published. A tag can never
  # be moved or deleted, so the whole path is proven here before the next one is pushed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    uses: ./.github/workflows/appimage.yml
    with:
      updater: true
      artifact: skykeep-appimage
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # On x86_64 and on 64-bit ARM (Linux on Apple Silicon Macs): each architecture's .deb and .rpm,
  # built on a machine of that architecture and started there. The AppImage is x86_64 only.
  linux:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The updater binds each signature to the version the program was built as, and
      # latest.json names the tag's: they must be the same, or every update would be refused.
      - name: The tag is the version built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but tauri.conf.json says $built"
            exit 1
          fi
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libheif-plugin-libde265 libfuse3-dev pkg-config patchelf rpm file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            xvfb xauth dbus
          # The GStreamer plugins are here for two reasons: the AppImage carries the ones
          # installed on this machine (bundleMediaFramework), and the launch checks below run
          # the program as it will run for someone playing a video.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Build the packages
        # The build machine's paths are never written into the program. The .deb and .rpm are
        # updated by package managers, so nothing here is signed; the AppImage is (appimage).
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build --bundles deb,rpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.arch == 'x64'
        with:
          name: skykeep-appimage
          path: target/release/bundle/appimage
      # One check for every package: the program is started headless with --background (no
      # window is asked for unless sign-in needs one), on its own session bus, in an empty home,
      # and must still be running 8 s later. `timeout` ending it (124) is the pass; any other
      # exit means it died on start. Its output is printed either way.
      - name: Write the launch check
        run: |
          cat > "$RUNNER_TEMP/stays-up.sh" <<'SH'
          #!/bin/bash
          # stays-up.sh <label> <command…>: the command must still be running after $SECS s (8).
          set -u
          label=$1; shift
          secs=${SECS:-8}
          HOME=$(mktemp -d); XDG_RUNTIME_DIR=$(mktemp -d)
          export HOME XDG_RUNTIME_DIR RUST_BACKTRACE=1
          chmod 700 "$XDG_RUNTIME_DIR"
          log=$(mktemp)
          timeout --kill-after=5 "$secs" dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" "$@" >"$log" 2>&1
          rc=$?
          cat "$log"
          if [ "$rc" -ne 124 ]; then echo "::error::$label exited on start (code $rc)"; exit 1; fi
          if grep -q "panicked at" "$log"; then echo "::error::$label panicked"; exit 1; fi
          echo "$label: still running after $secs s"
          SH
          chmod +x "$RUNNER_TEMP/stays-up.sh"
      - name: The .deb installs and its program starts
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          dpkg-deb -f "$deb" Depends
          # "./": apt takes a bare relative path for a package name ("Unable to locate package").
          sudo apt-get install -y "./$deb"
          prog=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep -m1 '^/usr/bin/')
          echo "installed: $prog"
          if ldd "$prog" | grep "not found"; then exit 1; fi
          "$RUNNER_TEMP/stays-up.sh" deb "$prog" --background
      - name: The .rpm installs and its program starts, on Fedora
        run: |
          rpm -qpR target/release/bundle/rpm/*.rpm
          docker run --rm -v "$PWD/target/release/bundle/rpm:/pkgs:ro" -v "$RUNNER_TEMP:/check:ro" fedora:41 bash -euc '
            dnf -y -q install /pkgs/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon which
            prog=$(rpm -ql "$(rpm -qp --qf "%{NAME}" /pkgs/*.rpm)" | grep -m1 "^/usr/bin/")
            echo "installed: $prog"
            if ldd "$prog" | grep "not found"; then exit 1; fi
            /check/stays-up.sh rpm "$prog" --background
          '
      - name: The .AppImage starts, with the .deb removed
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get remove -y "$(dpkg-deb -f target/release/bundle/deb/*.deb Package)"
          app=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          "$RUNNER_TEMP/stays-up.sh" AppImage "$app" --appimage-extract-and-run --background
      # As the AppImage catalog runs it: no network at all, in clean containers of the oldest
      # Ubuntu LTS it is built for and of a newer distribution, started as a person starts it
      # (no arguments: the window opens) and still up 15 s later. Each container first gets
      # what every desktop has and an AppImage leaves to it (GL, X11, fonts, ALSA: linuxdeploy's
      # excludelist) and the check's own Xvfb and D-Bus, then runs with --network none.
      - name: The .AppImage starts offline, on Ubuntu 22.04 and Fedora 41
        if: matrix.arch == 'x64'
        run: |
          app=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          offline() { # offline <image> <install command>
            docker rm -f desk >/dev/null 2>&1 || true
            docker run --name desk "$1" bash -euc "$2"
            docker commit desk "desk-${1//:/-}" >/dev/null
            docker rm desk >/dev/null
            docker run --rm --network none -e SECS=15 \
              -v "$PWD/$(dirname "$app"):/app:ro" -v "$RUNNER_TEMP:/check:ro" "desk-${1//:/-}" \
              bash -euc 'cd "$(mktemp -d)" && /app/'"$(basename "$app")"' --appimage-extract >/dev/null
                /check/stays-up.sh "AppImage on $(. /etc/os-release && echo "$PRETTY_NAME"), offline" "$PWD/squashfs-root/AppRun"'
          }
          offline ubuntu:22.04 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xauth dbus libgl1 libegl1 libgles2 \
              libfontconfig1 fonts-dejavu-core libx11-6 libx11-xcb1 libxcb1 libdrm2 libharfbuzz0b \
              libfribidi0 libfreetype6 libasound2 libgpg-error0 >/dev/null'
          offline fedora:41 'dnf -y -q install --setopt=install_weak_deps=False \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon which mesa-libGL mesa-libEGL \
            libglvnd-gles fontconfig dejavu-sans-fonts libX11 libX11-xcb libxcb libdrm harfbuzz \
            fribidi freetype alsa-lib libgpg-error'
      - name: Checksums
        run: |
          cd target/release/bundle
          if [ "${{ matrix.arch }}" = x64 ]; then sums=SHA256SUMS-linux.txt; else sums=SHA256SUMS-linux-arm64.txt; fi
          # shellcheck disable=SC2046
          sha256sum deb/*.deb rpm/*.rpm $(ls appimage/*.AppImage 2>/dev/null) | sed 's#  [a-z]*/#  #' > "$sums"
          cat "$sums"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skykeep-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/SHA256SUMS-linux*.txt
          if-no-files-found: error

  # Build once: when this exact commit passed the Windows checks (windows-checks.yml, by SHA:
  # tests, Explorer test, installers signed for the updater, installed and started, MSIX), the
  # release publishes those very installers, byte for byte, instead of building Windows again
  # (an hour of a release spent re-making what was already proven). Anything else — no such
  # run, or its signed installers missing or expired — and the release builds and tests Windows
  # itself, as before. Nothing is published that was not proven.
  windows-proven:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.ask.outputs.proven }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          run=$(gh api "repos/$REPO/actions/workflows/windows-checks.yml/runs?head_sha=$SHA&status=success&per_page=1" \
            -q '.workflow_runs[0] | select(.head_sha == env.SHA) | .id' 2>/dev/null || true)
          if [ -z "$run" ]; then
            echo "no successful Windows checks on $SHA: the release builds and tests Windows itself"
            echo "proven=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh run download "$run" --repo "$REPO" --name skykeep-windows --dir promoted \
            && ls promoted/msi/*.msi.sig promoted/nsis/*-setup.exe.sig promoted/SHA256SUMS-windows.txt; then
            echo "Windows checks run $run passed on $SHA: its signed installers are this release's"
            echo "proven=true" >> "$GITHUB_OUTPUT"
          else
            echo "run $run has no signed installers (older run, or expired): the release builds Windows itself"
            echo "proven=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ask.outputs.proven == 'true'
        with:
          name: skykeep-windows
          path: promoted
          if-no-files-found: error

  windows:
    needs: windows-proven
    if: needs.windows-proven.outputs.proven != 'true'
    uses: ./.github/workflows/windows.yml
    with:
      test_first: true
      updater: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The Flatpak bundle, built offline in the Flathub container and proven to install and start.
  # Attached to the release for anyone who installs Flatpaks by hand (not Flathub).
  flatpak:
    uses: ./.github/workflows/flatpak.yml

  publish:
    # Windows is either promoted (windows-proven) or built here (windows, then skipped otherwise):
    # every needed job succeeded or was rightly skipped, none failed or was cancelled.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [appimage, linux, windows-proven, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the tag's own message, which becomes the update's notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: source
      # A tag publishes only what is meant to be public (see ci.yml's `published`).
      - name: Nothing stray is published
        working-directory: source
        run: |
          stray=$(git ls-files | grep -vxE -f <(grep -vE '^(#|$)' .github/published-paths) || true)
          if [ -n "$stray" ]; then echo "::error::Not meant to be published:"; echo "$stray"; exit 1; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      # What the in-app updater reads: the version, the tag's message as its notes, and for each
      # kind of install that updates itself, where its file will be and its signature. The
      # updater looks for `<os>-<arch>-<installer>`; with no plain `linux-x86_64`, a .deb or .rpm
      # can never be handed the AppImage.
      - name: The updater's latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          git -C source fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git -C source tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" | sed -e '/-----BEGIN PGP SIGNATURE-----/,$d')
          one() { find dist -type f -name "$1" | head -n1; }
          appimage=$(one '*.AppImage'); nsis=$(one '*-setup.exe'); msi=$(one '*.msi')
          for f in "$appimage" "$nsis" "$msi"; do
            if [ -z "$f" ] || [ ! -s "$f.sig" ]; then echo "::error::no signed updater file for '$f'"; exit 1; fi
          done
          base="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"
          entry() { jq -n --arg url "$base/$(basename "$1")" --rawfile sig "$1.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'; }
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson appimage "$(entry "$appimage")" \
            --argjson nsis "$(entry "$nsis")" \
            --argjson msi "$(entry "$msi")" \
            '{version: $version, notes: ($notes | gsub("^\\s+|\\s+$"; "")), pub_date: $date,
              platforms: {"linux-x86_64-appimage": $appimage, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi}}' \
            > dist/latest.json
          cat dist/latest.json
      # One-click downloads: a copy of each installer under a name without the version, so the
      # README can link to releases/latest/download/<name> and the download starts at once. They
      # are byte-for-byte copies with their own checksum list. They live outside dist/, so
      # latest.json and the .sig files above only ever name the versioned originals.
      - name: Copies without the version, for one-click links
        run: |
          out="$RUNNER_TEMP/oneclick"; mkdir -p "$out"
          copy() {
            found=$(find dist -type f -name "$1")
            if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
              echo "::error::expected exactly one '$1' for $2, found: ${found:-none}"; exit 1
            fi
            cp "$found" "$out/$2"
          }
          copy '*-setup.exe' Skykeep-windows-x64-setup.exe
          copy '*.msi' Skykeep-windows-x64.msi
          copy '*_amd64.deb' Skykeep-linux-amd64.deb
          copy '*.x86_64.rpm' Skykeep-linux-x86_64.rpm
          copy '*_arm64.deb' Skykeep-linux-arm64.deb
          copy '*.aarch64.rpm' Skykeep-linux-aarch64.rpm
          copy '*.AppImage' Skykeep-linux-x86_64.AppImage
          copy '*.flatpak' Skykeep-linux-x86_64.flatpak
          (cd "$out" && sha256sum Skykeep-* > SHA256SUMS-unversioned.txt && cat SHA256SUMS-unversioned.txt)
      # The bundle under the release's own name, with a checksum list of its own, so it sits
      # beside the .deb, .rpm and AppImage of the same version.
      - name: The Flatpak under the release's name
        run: |
          found=$(find dist -type f -name '*.flatpak')
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then echo "::error::expected exactly one .flatpak, found: ${found:-none}"; exit 1; fi
          mkdir -p dist/flatpak-release
          name="Skykeep-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          mv "$found" "dist/flatpak-release/$name"
          (cd dist/flatpak-release && sha256sum "$name" > SHA256SUMS-flatpak.txt && cat SHA256SUMS-flatpak.txt)
      - name: A draft release with every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.msi' -o -name '*-setup.exe' -o -name 'SHA256SUMS*' \
              -o -name '*.AppImage.sig' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' -o -name 'latest.json' \) -print0
            find "$RUNNER_TEMP/oneclick" -type f -print0; } \
            | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --draft --verify-tag --title "Skykeep ${GITHUB_REF_NAME#v}" --generate-notes
