# A release, from one tag: `git tag v0.2.0 && git push origin v0.2.0`.
#   linux   — the AppImage, the .deb and .rpm (x86_64 and 64-bit ARM), the Flatpak and the
#             signed APK (linux.yml: each installed and started, the AppImage also offline on
#             Ubuntu 22.04 and Fedora 41);
#   windows — the Windows pipeline (windows.yml): its tests, the .msi and .exe, the smoke test;
#   publish — every file that passed in one draft release with its checksums and its notes
#             (the tag's message, then the APK's signing fingerprint); a platform whose build
#             failed is added when re-run. Each installer is also attached
#             under a name without the version (Skykeep-linux-amd64.deb and so on), which is
#             what the README's releases/latest/download/ links point at.
#
# The in-app updater (src-tauri/src/updates.rs) reads `latest.json` from the latest published
# release. What it can update — the AppImage, the .exe and the .msi — is signed with the
# TAURI_SIGNING_PRIVATE_KEY secret by sign-updater.yml, a job apart from the build that runs
# none of the build's code (a .sig beside each, with the version signed into it); publish
# writes latest.json from those signatures. The .deb and .rpm are updated by package managers,
# so they are not in it. A draft is invisible to the updater until it is published.
#
#   verify  — the draft read back from GitHub as a person would check it: every file there,
#             every checksum list true, latest.json naming this version and three signed
#             installers that are in the release, the APK signed with Skykeep's own key, and
#             notes that are the tag's. All true, it is published as the latest release; any
#             one false, it stays a draft and the run fails, saying which.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from a branch: everything built and started, nothing published. A tag can never
  # be moved or deleted, so the whole path is proven here before the next one is pushed.
  workflow_dispatch:
    inputs:
      notes_commit:
        description: "The release commit (\"Skykeep x.y.z\") whose message is the notes, when the tag is a later commit (tag.yml gives it)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Each platform built once, here, in parallel; nothing waits on a run elsewhere.
  linux:
    uses: ./.github/workflows/linux.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      test_first: true
      updater: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    # Whatever built and passed its own checks goes out; a platform whose build failed is left
    # out, named in the run's summary, and added to the same release when its job is re-run
    # (GitHub re-runs this job with it; every step below takes what is there). Each platform's
    # own tests still decide whether its file exists at all.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the tag's own message, which becomes the update's notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: source
      # A tag publishes only what is meant to be public (see ci.yml's `published`).
      - name: Nothing stray is published
        working-directory: source
        run: |
          stray=$(git ls-files | grep -vxE -f <(grep -vE '^(#|$)' .github/published-paths) || true)
          if [ -n "$stray" ]; then echo "::error::Not meant to be published:"; echo "$stray"; exit 1; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      # What the in-app updater reads: the version, the tag's message as its notes, and for each
      # kind of install that updates itself, where its file will be and its signature. The
      # updater looks for `<os>-<arch>-<installer>`; with no plain `linux-x86_64`, a .deb or .rpm
      # can never be handed the AppImage.
      - name: The updater's latest.json
        env:
          NOTES_COMMIT: ${{ inputs.notes_commit }}
          REPO: ${{ github.repository }}
        run: |
          # The notes: the release commit's message ("Skykeep x.y.z", then its paragraph). tag.yml
          # names it when the commit tagged is a later one (a fix after the release commit); a
          # tag pushed by hand on the release commit itself carries them already.
          if [ -n "$NOTES_COMMIT" ]; then
            git -C source fetch --depth=1 origin "$NOTES_COMMIT"
            git -C source log -1 --format=%B "$NOTES_COMMIT" > "$RUNNER_TEMP/notes-full"
          else
            git -C source fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git -C source log -1 --format=%B "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes-full"
          fi
          if [ "$(head -n1 "$RUNNER_TEMP/notes-full")" != "Skykeep ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::the notes' commit isn't \"Skykeep ${GITHUB_REF_NAME#v}\": $(head -n1 "$RUNNER_TEMP/notes-full")"; exit 1
          fi
          # Without its "Skykeep x.y.z" line, as on the release page: the update card already
          # names the version above its "What's new", which repeated it as its first line. Each
          # paragraph on one line: the card keeps line breaks (pre-wrap), and the commit's own,
          # at about 95 characters, broke every line again inside its narrower width.
          notes=$(tail -n +2 "$RUNNER_TEMP/notes-full" | sed -e '/./,$!d' \
            | awk 'NF { p = p ? p " " $0 : $0; next } p { print p; p = "" ; print "" } END { if (p) print p }')
          # Only an installer that is here, with its signature, is offered: an updater is never
          # pointed at a file this release doesn't have.
          base="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          add() {
            f=$(find dist -type f -name "$2" | head -n1)
            if [ -z "$f" ] || [ ! -s "$f.sig" ]; then echo "::warning::$1 is not in this release yet (its build did not pass)"; return; fi
            platforms=$(jq --arg k "$1" --arg url "$base/$(basename "$f")" --rawfile sig "$f.sig" \
              '. + {($k): {url: $url, signature: ($sig | rtrimstr("\n"))}}' <<< "$platforms")
          }
          add linux-x86_64-appimage '*.AppImage'
          add windows-x86_64-nsis '*-setup.exe'
          add windows-x86_64-msi '*.msi'
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: ($notes | gsub("^\\s+|\\s+$"; "")), pub_date: $date, platforms: $platforms}' \
            > dist/latest.json
          cat dist/latest.json
      # One-click downloads: a copy of each installer under a name without the version, so the
      # README can link to releases/latest/download/<name> and the download starts at once. They
      # are byte-for-byte copies with their own checksum list. They live outside dist/, so
      # latest.json and the .sig files above only ever name the versioned originals.
      - name: Copies without the version, for one-click links
        run: |
          out="$RUNNER_TEMP/oneclick"; mkdir -p "$out"
          copy() {
            found=$(find dist -type f -name "$1")
            n=$(printf '%s' "$found" | grep -c . || true)
            if [ "$n" -eq 0 ]; then echo "::warning::$2 is not in this release yet (its build did not pass)"; return; fi
            if [ "$n" -ne 1 ]; then echo "::error::expected one '$1' for $2, found: $found"; exit 1; fi
            cp "$found" "$out/$2"
          }
          copy '*-setup.exe' Skykeep-windows-x64-setup.exe
          copy '*.msi' Skykeep-windows-x64.msi
          copy '*_amd64.deb' Skykeep-linux-amd64.deb
          copy '*.x86_64.rpm' Skykeep-linux-x86_64.rpm
          copy '*_arm64.deb' Skykeep-linux-arm64.deb
          copy '*.aarch64.rpm' Skykeep-linux-aarch64.rpm
          copy '*.AppImage' Skykeep-linux-x86_64.AppImage
          copy '*.flatpak' Skykeep-linux-x86_64.flatpak
          copy '*-android.apk' Skykeep-android.apk
          (cd "$out" && sha256sum Skykeep-* > SHA256SUMS-unversioned.txt && cat SHA256SUMS-unversioned.txt)
      # The bundle under the release's own name, with a checksum list of its own, so it sits
      # beside the .deb, .rpm and AppImage of the same version.
      - name: The Flatpak under the release's name
        run: |
          found=$(find dist -type f -name '*.flatpak')
          n=$(printf '%s' "$found" | grep -c . || true)
          if [ "$n" -eq 0 ]; then echo "::warning::the Flatpak is not in this release yet"; exit 0; fi
          if [ "$n" -ne 1 ]; then echo "::error::expected one .flatpak, found: $found"; exit 1; fi
          mkdir -p dist/flatpak-release
          name="Skykeep-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          mv "$found" "dist/flatpak-release/$name"
          (cd dist/flatpak-release && sha256sum "$name" > SHA256SUMS-flatpak.txt && cat SHA256SUMS-flatpak.txt)
      # The first run makes the draft; a re-run (a platform added later) adds its files to the
      # same release and replaces latest.json and the checksum lists, which now name it too. A
      # re-run that brings the APK also adds its Android section to the notes: the first run had
      # no APK to read it from, and verify refuses notes without it (0.1.34).
      - name: The release, with every file that passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(
            find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*-android.apk' -o -name 'SHA256SUMS*' \
              -o -name '*.AppImage.sig' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' -o -name 'latest.json' \) -print0
            find "$RUNNER_TEMP/oneclick" -type f -print0)
          # Where the APK is and its signing key's fingerprint, read from the APK itself.
          apk=$(find dist -type f -name '*-android.apk' | head -n1)
          android() {
            fingerprint=$(keytool -printcert -jarfile "$apk" | awk '/SHA256:/ {print $2; exit}')
            printf '\n## Android\n\nDownload **Skykeep-android.apk** below (Android 10 or newer, 64-bit ARM). Its signing certificate'"'"'s SHA-256 fingerprint:\n\n```\n%s\n```\n' "$fingerprint"
          }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            body="$RUNNER_TEMP/body.md"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$body"
            if [ -n "$apk" ] && ! grep -q '^## Android$' "$body"; then
              # Before the Full Changelog line, where the first run puts it.
              notes="$RUNNER_TEMP/notes.md"
              awk -v section="$(android)" 'BEGIN { sub(/^\n/, "", section) } /^\*\*Full Changelog\*\*/ && !done { print section; print ""; done = 1 } { print } END { if (!done) { print ""; print section } }' "$body" > "$notes"
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          else
            # The page's notes: the tag's message without its "Skykeep x.y.z" line (the title
            # says it), then the Android section, then what changed since the last published
            # release.
            notes="$RUNNER_TEMP/notes.md"
            tail -n +2 "$RUNNER_TEMP/notes-full" \
              | sed -e '/-----BEGIN PGP SIGNATURE-----/,$d' | sed -e '/./,$!d' > "$notes"
            if [ -n "$apk" ]; then android >> "$notes"; fi
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$previous" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> "$notes"
            fi
            cat "$notes"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Skykeep ${GITHUB_REF_NAME#v}" --notes-file "$notes" "${files[@]}"
          fi

  verify:
    # Only a real release: a tag, every platform built (a re-run that adds one comes back here).
    # `!cancelled()` as publish has it: without it the condition carries an implicit success(),
    # which is false whenever a job earlier in the chain was skipped, and `linux` and `windows`
    # are skipped whenever their proven files are promoted, so verify never ran (0.1.26).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Skykeep's Android signing certificate (public; README and every release page show it).
      APK_CERT: "61:0A:64:50:6D:95:DA:6C:CE:75:FF:0E:40:B8:59:02:FA:41:E4:0D:00:1B:BA:87:BF:40:70:FE:CB:F2:3A:FB"
    steps:
      - name: The draft, read back and checked, then published
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir draft && cd draft
          gh release download "$GITHUB_REF_NAME" --repo "$REPO"
          fail() { echo "::error::$*"; exit 1; }
          # Every file a release carries, under its versioned and its one-click name.
          for f in latest.json SHA256SUMS-android.txt SHA256SUMS-appimage.txt SHA256SUMS-flatpak.txt \
            SHA256SUMS-linux-arm64.txt SHA256SUMS-linux.txt SHA256SUMS-unversioned.txt SHA256SUMS-windows.txt \
            "Skykeep-$v-1.aarch64.rpm" "Skykeep-$v-1.x86_64.rpm" "Skykeep-$v-android.apk" "Skykeep-$v-x86_64.flatpak" \
            "Skykeep_${v}_amd64.AppImage" "Skykeep_${v}_amd64.AppImage.sig" "Skykeep_${v}_amd64.deb" "Skykeep_${v}_arm64.deb" \
            "Skykeep_${v}_x64-setup.exe" "Skykeep_${v}_x64-setup.exe.sig" "Skykeep_${v}_x64_en-US.msi" "Skykeep_${v}_x64_en-US.msi.sig" \
            Skykeep-android.apk Skykeep-linux-aarch64.rpm Skykeep-linux-amd64.deb Skykeep-linux-arm64.deb \
            Skykeep-linux-x86_64.AppImage Skykeep-linux-x86_64.flatpak Skykeep-linux-x86_64.rpm \
            Skykeep-windows-x64-setup.exe Skykeep-windows-x64.msi; do
            [ -s "$f" ] || fail "the draft lacks $f"
          done
          # Every checksum list true, and each one checked something.
          for f in SHA256SUMS-*.txt; do
            sha256sum --strict -c "$f" || fail "$f does not match the files"
          done
          # The updater's file: this version, three signed installers, each one in this release.
          jq -e --arg v "$v" '.version == $v' latest.json >/dev/null || fail "latest.json is not $v"
          for k in linux-x86_64-appimage windows-x86_64-nsis windows-x86_64-msi; do
            name=$(jq -r --arg k "$k" '.platforms[$k].url // "" | split("/") | last' latest.json)
            sig=$(jq -r --arg k "$k" '.platforms[$k].signature // ""' latest.json)
            [ -n "$name" ] && [ -s "$name" ] || fail "latest.json's $k is not a file of this release"
            [ "$sig" = "$(tr -d '\n' < "$name.sig")" ] || fail "latest.json's $k signature is not $name.sig"
          done
          [ -n "$(jq -r .notes latest.json)" ] || fail "latest.json has no notes"
          # The APK, signed with Skykeep's own key (both names, byte for byte the same file).
          cmp -s "Skykeep-$v-android.apk" Skykeep-android.apk || fail "the two APKs differ"
          got=$(keytool -printcert -jarfile Skykeep-android.apk | awk '/SHA256:/ {print $2; exit}')
          [ "$got" = "$APK_CERT" ] || fail "the APK is signed with $got, not Skykeep's key"
          # The page's notes are the tag's, never GitHub's generated list.
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json body -q .body)
          case "$body" in ""|"## What's Changed"*) fail "the release notes are not the tag's message";; esac
          grep -qF "$APK_CERT" <<< "$body" || fail "the release notes lack the APK fingerprint"
          gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --draft=false --latest
          echo "Skykeep $v checked and published"
          # Every store, started by name: published with this job's token, the release starts
          # no workflow by itself (GitHub never lets GITHUB_TOKEN do that), so stores.yml's
          # `release: published` never fired, and 0.1.27 and 0.1.28 reached no store but the
          # Snap's daily catch-up. A dispatch is the one start this token is allowed.
          gh workflow run stores.yml --repo "$REPO" --ref main -f tag="$GITHUB_REF_NAME"
          echo "stores started for $GITHUB_REF_NAME"
