# A release, started by merging its pull request ("Skykeep x.y.z", from bump-version.py): that
# commit landing on main is tagged at once and the release (release.yml) started on the tag. Its
# pull request's checks (ci.yml, the licence list included) proved it; the release then builds
# and tests every platform itself. It tags only a commit on main whose version is not released
# yet. A tag made with the workflow's own token starts no workflow by itself, so the release is
# started here, by name. The release commit's message becomes the update's notes.
# By hand (Actions → Tag a release → Run workflow) for a given commit, or as a dry run.
name: Tag a release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to release (empty: the latest on main)"
        type: string
        default: ""
      dry_run:
        description: "Only check: say whether it could be released, tag nothing"
        type: boolean
        default: false
  # The release commit landing on main (it alone changes the version): tagged at once. Its
  # pull request's checks (ci.yml, the licence list included) are what proved it.
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]

permissions:
  contents: read

# One at a time: two presses never race to the same tag. Four checks finishing together queue
# here; the newest waiting run replaces an older one, and the last to finish sees all four.
concurrency:
  group: tag-a-release
  cancel-in-progress: false

jobs:
  tag:
    # Started by a check: only one that succeeded, on a commit whose message starts as a
    # release's does, takes a runner at all; the step below decides the rest.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'Skykeep ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # the licence list reads every crate's licence files (a few minutes)
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Ready to release
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIVEN: ${{ inputs.sha || github.sha }}
          DRY: ${{ inputs.dry_run }}
          AUTO: ${{ github.event_name == 'push' }}
        run: |
          # Started by a check finishing: only a release commit that is main's newest, once every
          # check is green, and only once. Anything else is not this run's to release: said, not
          # failed.
          pass() { echo "::notice::not releasing: $1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          SHA=$(git rev-parse --verify "${GIVEN:-HEAD}^{commit}") || { echo "::error::no such commit: $GIVEN"; exit 1; }
          export SHA
          if [ "$AUTO" = true ]; then
            [ "$SHA" = "$(git rev-parse HEAD)" ] || pass "$SHA is no longer main's newest commit"
            v=$(git show "$SHA:src-tauri/tauri.conf.json" | jq -r .version)
            [ "$(git log -1 --format=%s "$SHA")" = "Skykeep $v" ] || pass "$SHA is not a release commit"
            ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null || pass "v$v is already tagged"
          fi
          if ! git merge-base --is-ancestor "$SHA" HEAD; then echo "::error::$SHA is not on main"; exit 1; fi
          version=$(git show "$SHA:src-tauri/tauri.conf.json" | jq -r .version)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$DRY" = true ]; then echo "::warning::$tag already exists (dry run)"; else
              echo "::error::$tag already exists: a release is a new version (bump it on main first)"; exit 1; fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: The commit being released
        if: steps.ready.outputs.go == 'true'
        env:
          SHA: ${{ steps.ready.outputs.sha }}
        run: git checkout --detach "$SHA"
      - name: Tag, then start the release
        if: steps.ready.outputs.go == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ready.outputs.sha }}
          TAG: ${{ steps.ready.outputs.tag }}
        run: |
          # The notes are the release commit's ("Skykeep x.y.z" and its paragraph), wherever it is
          # in the history of the commit tagged: a fix merged after it (0.1.27's licence list) is
          # what gets tagged, and its own message isn't the release's. Its commit is
          # tag, passed to release.yml, which reads it as the notes. No such commit, no tag.
          version="${TAG#v}"
          release=$(git log --format=%H -1 --grep="^Skykeep ${version//./\\.}\$" "$SHA")
          if [ -z "$release" ]; then echo "::error::no commit \"Skykeep $version\" in the history of $SHA: bump the version with .github/scripts/bump-version.py first"; exit 1; fi
          git log -1 --format=%B "$release" > "$RUNNER_TEMP/notes"
          echo "notes from $release:"; cat "$RUNNER_TEMP/notes"
          # A plain tag, as every release has had: the job's token can't make an annotated tag
          # (the API's tag object answered 403; a git push of one was refused for lacking the
          # workflows permission). The release is told which commit holds the notes instead.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          echo "tagged $TAG on $SHA"
          gh workflow run release.yml --repo "$REPO" --ref "$TAG" -f notes_commit="$release"
          echo "release started on $TAG"
