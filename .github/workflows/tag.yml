# A release, started with one button: Actions → Tag a release → Run workflow.
# It tags only a commit that is on main, whose version is not released yet, and on which both
# CI (ci.yml), the Windows checks (windows-checks.yml), the Linux checks (linux-checks.yml) and
# Linux compatibility (linux-compat.yml, every distribution) succeeded — looked up by that exact
# SHA, so another commit's green run can never stand in for it (9 and 10 Nov: a run of a
# different commit was read as this one's, by a script and then by hand). Then it starts the
# release (release.yml) on the new tag: a tag made with the workflow's own token starts no
# workflow by itself, so it is started here, by name.
# The tag is the version bump's commit; its message becomes the update's notes.
name: Tag a release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to release (empty: the latest on main)"
        type: string
        default: ""
      dry_run:
        description: "Only check: say whether it could be released, tag nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One at a time: two presses never race to the same tag.
concurrency:
  group: tag-a-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # the licence list reads every crate's licence files (a few minutes)
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Ready to release
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIVEN: ${{ inputs.sha }}
          DRY: ${{ inputs.dry_run }}
        run: |
          SHA=$(git rev-parse --verify "${GIVEN:-HEAD}^{commit}") || { echo "::error::no such commit: $GIVEN"; exit 1; }
          export SHA
          if ! git merge-base --is-ancestor "$SHA" HEAD; then echo "::error::$SHA is not on main"; exit 1; fi
          version=$(git show "$SHA:src-tauri/tauri.conf.json" | jq -r .version)
          tag="v$version"
          for w in ci.yml windows-checks.yml linux-checks.yml linux-compat.yml; do
            # A run on main itself only: a pull request's (a fork's included) or a run on another
            # branch can carry the same SHA, and never stands in for it. Linux compatibility runs
            # by itself only on a push that changes the version (linux-compat.yml), so a fix
            # merged after the release commit is proven by running it by hand on main, for that
            # same SHA (gh workflow run linux-compat.yml --ref main), which counts too.
            events='"push"'
            [ "$w" = linux-compat.yml ] && events='"push", "workflow_dispatch"'
            run=$(gh api "repos/$REPO/actions/workflows/$w/runs?head_sha=$SHA&status=success&branch=main&per_page=20" \
              -q "[.workflow_runs[] | select(.head_sha == env.SHA and .head_branch == \"main\" and (.event | IN($events)))][0].html_url // empty")
            if [ -z "$run" ]; then echo "::error::$w has not succeeded on a push of $SHA to main (still running, failed, or never ran)"; exit 1; fi
            echo "$w succeeded on $SHA: $run"
          done
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$DRY" = true ]; then echo "::warning::$tag already exists (dry run)"; else
              echo "::error::$tag already exists: a release is a new version (bump it on main first)"; exit 1; fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The open-source licences the app shows (src/licences.json, written by `npm run licences`
      # and committed) must be the ones this commit's lockfiles give. Checked here, not on pull
      # requests, so a dependency update's pull request stays green until the list is rewritten.
      - name: The commit being released
        env:
          SHA: ${{ steps.ready.outputs.sha }}
        run: git checkout --detach "$SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Licence list current
        run: |
          # No install scripts: this job can push tags, so no package's own code runs in it.
          npm ci --no-audit --no-fund --ignore-scripts
          npm run licences
          if ! git diff --exit-code --stat src/licences.json; then
            echo "::error::src/licences.json is out of date: run npm run licences and commit"
            exit 1
          fi
      - name: Tag, then start the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ready.outputs.sha }}
          TAG: ${{ steps.ready.outputs.tag }}
        run: |
          # The notes are the release commit's ("Skykeep x.y.z" and its paragraph), wherever it is
          # in the history of the commit tagged: a fix merged after it (0.1.27's licence list) is
          # what gets tagged, and its own message isn't the release's. Carried in an annotated
          # tag, whose message is what release.yml reads as the notes. No such commit, no tag.
          version="${TAG#v}"
          release=$(git log --format=%H -1 --grep="^Skykeep ${version//./\\.}\$" "$SHA")
          if [ -z "$release" ]; then echo "::error::no commit \"Skykeep $version\" in the history of $SHA: bump the version with .github/scripts/bump-version.py first"; exit 1; fi
          git log -1 --format=%B "$release" > "$RUNNER_TEMP/notes"
          echo "notes from $release:"; cat "$RUNNER_TEMP/notes"
          # Made with git and pushed with the job's token: the token may push a tag, but the API's
          # tag-object endpoint answered it 403 ("Resource not accessible by integration", 0.1.27).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --file="$RUNNER_TEMP/notes" "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "tagged $TAG on $SHA"
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
          echo "release started on $TAG"
