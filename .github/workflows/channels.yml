# Whether every channel serves the latest release, after each Stores run and every day: a
# channel that silently stopped is found the same day, not by a user (17 Nov: Chocolatey,
# Scoop and winget got nothing for 0.1.27 and 0.1.28, and COPR failed to build both, and no
# run said so).
#
# Red when a channel that depends only on us lags: the in-app update feed, the Snap's stable
# channel, the Scoop bucket and COPR's latest successful build. Said, never red, for channels
# a person reviews first: Chocolatey's moderators, winget's, and the AUR (kept by the
# community).
name: Channels

# Started by Stores' last job once it is done (a workflow_run trigger never fired: Stores is
# itself started by the release's token), every morning, and by hand.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Every channel against the latest release
        run: |
          tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          want="${tag#v}"
          echo "latest release: $want"
          lag=()
          say() { printf '%-26s %s\n' "$1" "$2"; }
          check() { # name, version found, required (yes/no)
            if [ "$2" = "$want" ]; then say "$1" "ok ($2)"
            elif [ "$3" = yes ]; then say "$1" "BEHIND: ${2:-nothing} (wants $want)"; lag+=("$1")
            else say "$1" "waiting: ${2:-nothing} (wants $want; reviewed by people)"; echo "::notice::$1 has ${2:-nothing}, not $want yet (moderated)"; fi
          }
          feed=$(curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.json" | jq -r .version) || feed=""
          check "update feed (latest.json)" "$feed" yes
          snap=$(curl -fsSL -H 'Snap-Device-Series: 16' https://api.snapcraft.io/v2/snaps/info/skykeep \
            | jq -r '[."channel-map"[] | select(.channel.name == "stable") | .version] | first // empty') || snap=""
          check "Snap (stable)" "$snap" yes
          scoop=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/scoop-bucket/main/bucket/skykeep.json" | jq -r .version) || scoop=""
          check "Scoop bucket" "$scoop" yes
          copr=$(curl -fsSL "https://copr.fedorainfracloud.org/api_3/package/?ownername=yashonfed&projectname=skykeep&packagename=skykeep&with_latest_succeeded_build=true" \
            | jq -r '.builds.latest_succeeded.source_package.version // empty' | sed 's/-[0-9]*$//') || copr=""
          check "COPR (Fedora)" "$copr" yes
          choco=$(curl -fsSL "https://community.chocolatey.org/api/v2/FindPackagesById()?id='skykeep'&\$orderby=Version%20desc&\$top=1" \
            | grep -oE '<d:Version>[^<]+' | head -1 | sed 's/<d:Version>//') || choco=""
          check "Chocolatey" "$choco" no
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/y/YashwanthKamireddi/Skykeep/$want" --silent 2>/dev/null; then winget="$want"; else winget=""; fi
          check "winget" "$winget" no
          aur=$(curl -fsSL 'https://aur.archlinux.org/rpc/v5/info?arg[]=skykeep-bin' | jq -r '.results[0].Version // empty' | sed 's/-[0-9]*$//') || aur=""
          check "AUR skykeep-bin" "$aur" no
          if [ "${#lag[@]}" -gt 0 ]; then
            echo "::error::behind $want: ${lag[*]}"
            exit 1
          fi
