# Skykeep on every mainstream Linux, proven rather than assumed: the .deb, .rpm, Arch package
# and AppImage each installed with the distribution's own package manager in a clean container
# of it, then packaging/linux-compat/check.sh — every library found, the GStreamer elements
# the player needs, a HEIC decoded through the system's libheif, a made-up session through
# gnome-keyring's Secret Service by the app's own sign-in storage, the page drawn under Xvfb
# and the program still up 8 s later, and the launchers, metainfo and icons valid.
#
# The .deb and .rpm are also built on 64-bit ARM and installed in ARM containers of Ubuntu,
# Debian and Fedora, for Linux on Apple Silicon Macs.
#
# Not on every push: by hand (Actions → Linux compatibility → Run workflow), and for a release
# tag. The packages are built the way release.yml builds them: the .deb and .rpm on Ubuntu 24.04
# — the oldest base whose libheif (1.17) the app accepts; Debian 12 (libheif 1.15, glibc 2.36)
# cannot run them — and the AppImage in an Ubuntu 22.04 container (appimage.yml), carrying a
# libheif of its own, so it runs on 22.04 and newer; there it is also started with no network.
# `native` also builds from source on Debian 13, Fedora 42 and openSUSE Tumbleweed (and `arch`
# on Arch) with the build dependencies CONTRIBUTING lists, and installs each of those packages
# in a clean container of the distribution it was built on.
name: Linux compatibility

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: linux-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On x86_64 and on 64-bit ARM (Apple Silicon Macs run Linux on aarch64): each architecture's
  # packages, probe and test files as linux-compat-<arch>.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libfuse3-dev pkg-config patchelf rpm file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libheif-plugin-libde265 libheif-examples libheif-plugin-x265
          # x265 only encodes the test's HEIC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Build the packages
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build --bundles deb,rpm
      - name: Build the check's probe
        run: cargo build --release --locked -p quince-probe --example distro_check
      - name: A HEIC made for the test
        # A 64×48 gradient, written as raw YUV and encoded with x265 — nobody's photo.
        run: |
          W=64 H=48
          { printf 'YUV4MPEG2 W%s H%s F25:1 Ip A1:1 C420jpeg\nFRAME\n' "$W" "$H"
            LC_ALL=C awk -v w=$W -v h=$H 'BEGIN {
              for (y = 0; y < h; y++) for (x = 0; x < w; x++) printf "%c", 16 + int(200 * x / w)
              for (i = 0; i < w * h / 2; i++) printf "%c", 90 + int(80 * (i % (w / 2)) / (w / 2)) }'
          } > "$RUNNER_TEMP/test.y4m"
          heif-enc -q 80 -o test.heic "$RUNNER_TEMP/test.y4m"
      - name: Gather
        run: |
          mkdir compat
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
             target/release/examples/distro_check test.heic packaging/linux-compat/check.sh \
             crates/quince-media/tests/fixtures/black-start.mp4 \
             crates/quince-media/tests/fixtures/hevc.mov compat/
          ls -l compat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-compat-${{ matrix.arch }}
          path: compat/
          if-no-files-found: error
          retention-days: 7

  # The AppImage and a probe built beside it, on Ubuntu 22.04: a probe from the 24.04 build would
  # itself need glibc 2.39 there.
  appimage:
    uses: ./.github/workflows/appimage.yml
    with:
      probe: true
      artifact: linux-compat-appimage

  install:
    needs: [build, appimage]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04 (.deb)", image: "ubuntu:24.04", pkg: "*.deb" }
          - { name: "Debian 13 (.deb)", image: "debian:trixie", pkg: "*.deb" }
          # Linux Mint 22 and Pop!_OS 24.04 are both Ubuntu 24.04 underneath; Mint publishes
          # an image of its own, Pop!_OS does not.
          - { name: "Linux Mint 22 (.deb)", image: "linuxmintd/mint22-amd64", pkg: "*.deb" }
          - { name: "Fedora 41 (.rpm)", image: "fedora:41", pkg: "*.rpm" }
          - { name: "Fedora 42 (.rpm)", image: "fedora:42", pkg: "*.rpm" }
          - { name: "openSUSE Tumbleweed (.rpm)", image: "opensuse/tumbleweed", pkg: "*.rpm" }
          # The AppImage's launches run with no network (check.sh, unshare -n), which needs
          # CAP_SYS_ADMIN in the container.
          - { name: "Ubuntu 22.04 (AppImage)", image: "ubuntu:22.04", pkg: "*.AppImage", options: "--cap-add=SYS_ADMIN" }
          - { name: "Ubuntu 24.04 (AppImage)", image: "ubuntu:24.04", pkg: "*.AppImage", options: "--cap-add=SYS_ADMIN" }
          - { name: "Debian 13 (AppImage)", image: "debian:trixie", pkg: "*.AppImage", options: "--cap-add=SYS_ADMIN" }
          - { name: "Fedora 42 (AppImage)", image: "fedora:42", pkg: "*.AppImage", options: "--cap-add=SYS_ADMIN" }
          # 64-bit ARM, each on an ARM machine: Ubuntu and Debian as on Asahi Ubuntu, Fedora as
          # Fedora Asahi Remix is.
          - { name: "Ubuntu 24.04 (.deb, ARM)", image: "ubuntu:24.04", pkg: "*.deb", arch: arm64 }
          - { name: "Debian 13 (.deb, ARM)", image: "debian:trixie", pkg: "*.deb", arch: arm64 }
          - { name: "Fedora 42 (.rpm, ARM)", image: "fedora:42", pkg: "*.rpm", arch: arm64 }
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-compat-${{ matrix.arch || 'x64' }}
          path: /compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.pkg == '*.AppImage'
        with:
          name: linux-compat-appimage
          path: /appimage
      - name: Install and run
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          chmod +x /compat/check.sh /compat/distro_check
          if [ "$PKG" = '*.AppImage' ]; then
            chmod +x /appimage/distro_check
            bash /compat/check.sh /appimage/*.AppImage /appimage/distro_check /compat/test.heic \
              /compat/black-start.mp4 /compat/hevc.mov
          else
            # shellcheck disable=SC2086
            bash /compat/check.sh /compat/$PKG /compat/distro_check /compat/test.heic \
              /compat/black-start.mp4 /compat/hevc.mov
          fi

  # The packages built on each distribution itself, from the build dependencies CONTRIBUTING
  # lists for it — so a missing or renamed -devel package, a compiler that disagrees or a
  # Node too old shows up here, not in an issue from someone building from source.
  native:
    name: Build on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13", key: debian13, image: "debian:trixie", bundle: deb }
          - { name: "Fedora 42", key: fedora42, image: "fedora:42", bundle: rpm }
          - { name: "openSUSE Tumbleweed", key: tumbleweed, image: "opensuse/tumbleweed", bundle: rpm }
    container:
      image: ${{ matrix.image }}
      # openSUSE's image declares no PATH. The runner builds each step's PATH from the image's
      # own plus what steps add (GITHUB_PATH, the rustup line below) — with none declared, a
      # step after one adds a directory got only that directory and no /usr/bin: "exec: sh:
      # executable file not found". Every other image here declares exactly this.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Build dependencies, as CONTRIBUTING lists them
        run: |
          case "${{ matrix.key }}" in
            debian13)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential curl ca-certificates git nodejs npm \
                libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsecret-1-dev \
                libheif-dev libfuse3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                pkg-config libayatana-appindicator3-dev ;;
            fedora42)
              dnf -y install gcc gcc-c++ make curl git nodejs npm \
                webkit2gtk4.1-devel gtk3-devel librsvg2-devel libsecret-devel \
                libheif-devel fuse3-devel gstreamer1-devel gstreamer1-plugins-base-devel \
                pkgconf-pkg-config libayatana-appindicator-gtk3-devel ;;
            tumbleweed)
              # Tumbleweed rolls: the image can be newer than a mirror that is mid-sync (6 Nov:
              # libnghttp2 1.71 installed, its -devel only 1.70), and then nothing installs. A
              # distribution upgrade first lines the system up with the repositories, as
              # openSUSE says to do on Tumbleweed, so a mirror's timing never fails the build.
              zypper -n dup --no-recommends
              zypper -n install --no-recommends gcc gcc-c++ make curl git tar gzip \
                nodejs-default npm-default \
                webkitgtk3-devel gtk3-devel librsvg-devel libsecret-devel \
                libheif-devel fuse3-devel gstreamer-devel gstreamer-plugins-base-devel \
                pkgconf-pkg-config libayatana-appindicator3-devel ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, the version rust-toolchain.toml pins
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - name: Build the package
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.key }}
          path: target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 7

  native-install:
    needs: [build, native]
    name: ${{ matrix.name }} (built there)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13", key: debian13, image: "debian:trixie", bundle: deb }
          - { name: "Fedora 42", key: fedora42, image: "fedora:42", bundle: rpm }
          - { name: "openSUSE Tumbleweed", key: tumbleweed, image: "opensuse/tumbleweed", bundle: rpm }
    container:
      image: ${{ matrix.image }}
      # As in `native`: openSUSE's image declares no PATH of its own.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Tools the artifact actions need
        if: matrix.key == 'tumbleweed'
        run: zypper -n install --no-recommends tar gzip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-compat-x64
          path: /compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.key }}
          path: /native
      - name: Install and run
        run: |
          chmod +x /compat/check.sh /compat/distro_check
          bash /compat/check.sh "$(ls /native/*.${{ matrix.bundle }})" /compat/distro_check /compat/test.heic \
            /compat/black-start.mp4 /compat/hevc.mov

  arch:
    needs: build
    name: Arch Linux (PKGBUILD)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
      # Arch's gnome-keyring-daemon, started as root, drops its capabilities and aborts
      # ("error dropping process capabilities") when the container's bounding set lacks some;
      # the keyring check then fails for the container, not for Skykeep. With every capability
      # it starts (checked under podman).
      options: --cap-add=ALL
    # bash, not the container's sh: Arch's sh is bash in POSIX mode, whose `source` looks for a
    # bare file name only on PATH — never in the current directory — so `source PKGBUILD`
    # failed with "file not found" from inside packaging/arch.
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-compat-x64
          path: /compat
      - name: makepkg, as a user (it refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # The package's own dependencies, from its PKGBUILD, as makepkg -s would install them.
          # shellcheck disable=SC1091
          (cd packaging/arch && source ./PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}")
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && CARGO_BUILD_JOBS=4 makepkg -f --noconfirm"
      - name: Install and run
        run: |
          chmod +x /compat/check.sh /compat/distro_check
          bash /compat/check.sh "$(ls "$GITHUB_WORKSPACE"/packaging/arch/skykeep-[0-9]*.pkg.tar.zst)" \
            /compat/distro_check /compat/test.heic /compat/black-start.mp4 /compat/hevc.mov
