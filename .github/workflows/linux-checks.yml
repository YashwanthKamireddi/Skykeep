# Linux and Android, checked on every push to main, as windows-checks.yml checks Windows: every
# file a release publishes for them is built, installed, started and (the AppImage, the APK)
# signed here, so a commit is ready to release the moment it is green, and the release only
# promotes these files (release.yml, linux-proven) instead of building them again.
# Every commit keeps its own run (grouped by SHA): a newer push never cancels the run a release
# candidate is waiting on.
name: Linux checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "packaging/aur/**"
  workflow_dispatch:
  # Every Monday, a full build and test of everything, so a tool that changed or a system past
  # its end of life shows up mid-week, never on release day.
  schedule:
    - cron: "0 6 * * 1"

# A newer push to main cancels an older commit's run (only the newest needs checking), except a
# release commit ("Skykeep x.y.z"): it keeps a group of its own, so nothing that lands after it
# can cancel the runs its tag waits for (tag.yml). Before, every commit kept its run, and four
# merges in a row ran sixteen workflows to the end.
concurrency:
  group: linux-checks-${{ (startsWith(github.event.head_commit.message, 'Skykeep ') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Skykeep ') }}

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
