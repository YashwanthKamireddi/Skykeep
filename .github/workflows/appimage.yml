# The AppImage, built on the oldest Ubuntu LTS it runs on (22.04, glibc 2.35), so it starts on
# that and everything newer. An AppImage uses the C library and libstdc++ of the computer it
# runs on, never its own: built on 24.04 it needed glibc 2.39 and failed on 22.04 before its
# first line ran. So it is built in a clean ubuntu:22.04 container, and nothing is kept unless
# every ELF file in it asks for at most glibc 2.35 and 22.04's libstdc++ (GLIBCXX 3.4.30,
# CXXABI 1.3.13).
#
# Ubuntu 22.04's libheif is 1.12, older than the 1.17 the app is built for (libheif-rs, v1_17),
# so libheif and its HEVC decoder libde265 are built here from their release tarballs (checked
# against the hashes below) into the multiarch paths tauri.conf.json's appimage.files names,
# and the AppImage carries them, as it carried Ubuntu 24.04's before.
#
# Called by release.yml (signed for the updater) and linux-compat.yml (with the check's probe,
# built on the same base so it runs on 22.04 too).
name: AppImage

on:
  workflow_call:
    inputs:
      # A release: the AppImage signed for the in-app updater, with its .sig.
      updater:
        type: boolean
        default: false
      # linux-compat.yml: the probe's distro_check example, built against the same libraries.
      probe:
        type: boolean
        default: false
      artifact:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  LIBDE265_VERSION: "1.0.16"
  LIBDE265_SHA256: b92beb6b53c346db9a8fae968d686ab706240099cdd5aff87777362d668b0de7
  LIBHEIF_VERSION: "1.19.8"
  LIBHEIF_SHA256: 6c4a5b08e6eae66d199977468859dea3b5e059081db8928f7c7c16e53836c906

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates git file patchelf binutils pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libfuse3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          # The GStreamer plugins are what the AppImage carries (bundleMediaFramework).
          # Ubuntu's own libheif (1.12) must not be here: the one built below takes its place.
          if dpkg-query -W -f '${Status}' libheif1 2>/dev/null | grep -q 'ok installed'; then
            echo "::error::Ubuntu's libheif1 was pulled in; it would clash with the one built here"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: libde265 and libheif, from their release tarballs
        run: |
          src=$(mktemp -d)
          fetch() { # fetch <url> <sha256>
            curl -fsSL -o "$src/$(basename "$1")" "$1"
            echo "$2  $src/$(basename "$1")" | sha256sum -c -
            tar -xzf "$src/$(basename "$1")" -C "$src"
          }
          fetch "https://github.com/strukturag/libde265/releases/download/v$LIBDE265_VERSION/libde265-$LIBDE265_VERSION.tar.gz" "$LIBDE265_SHA256"
          fetch "https://github.com/strukturag/libheif/releases/download/v$LIBHEIF_VERSION/libheif-$LIBHEIF_VERSION.tar.gz" "$LIBHEIF_SHA256"
          # libde265 with autotools: its CMake build gives the library no soname (libde265.so,
          # not libde265.so.0). Decoder only.
          (cd "$src/libde265-$LIBDE265_VERSION" &&
            ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu \
              --disable-static --disable-dec265 --disable-sherlock265 --disable-encoder &&
            make -j"$(nproc)" && make install)
          # libheif decoding HEIC only, with libde265 as a plugin in the directory Debian and
          # Ubuntu use — the one appimage.files copies it from and appimage.rs points it at.
          cmake -S "$src/libheif-$LIBHEIF_VERSION" -B "$src/heif-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu \
            -DPLUGIN_DIRECTORY=/usr/lib/x86_64-linux-gnu/libheif/plugins \
            -DWITH_LIBDE265=ON -DWITH_LIBDE265_PLUGIN=ON \
            -DWITH_X265=OFF -DWITH_AOM_DECODER=OFF -DWITH_AOM_ENCODER=OFF \
            -DWITH_OpenH264_DECODER=OFF -DWITH_DAV1D=OFF -DWITH_RAV1E=OFF -DWITH_SvtEnc=OFF \
            -DWITH_JPEG_DECODER=OFF -DWITH_JPEG_ENCODER=OFF \
            -DWITH_OpenJPEG_DECODER=OFF -DWITH_OpenJPEG_ENCODER=OFF \
            -DWITH_LIBSHARPYUV=OFF -DWITH_EXAMPLES=OFF -DWITH_GDK_PIXBUF=OFF -DBUILD_TESTING=OFF
          cmake --build "$src/heif-build" -j"$(nproc)"
          cmake --install "$src/heif-build"
          ldconfig
          pkg-config --modversion libheif libde265
          ls -l /usr/lib/x86_64-linux-gnu/libheif/plugins/libheif-libde265.so /usr/lib/x86_64-linux-gnu/libde265.so.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: appimage-jammy
      - run: npm ci --no-audit --no-fund
      - name: Build the AppImage
        # The build machine's paths are never written into the program. linuxdeploy, which
        # Tauri runs, is an AppImage itself; a container has no FUSE, so it unpacks itself.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
          APPIMAGE_EXTRACT_AND_RUN: "1"
          UPDATER: ${{ inputs.updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$UPDATER" = true ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::a release needs the TAURI_SIGNING_PRIVATE_KEY secret to sign its updates"
              exit 1
            fi
            npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
            ls target/release/bundle/appimage/*.AppImage.sig
          else
            npx tauri build --bundles appimage
          fi
      - name: Nothing in it needs more than Ubuntu 22.04 has
        # Every ELF file's version needs (objdump -p, "Version References"), against 22.04's
        # glibc 2.35 and libstdc++ (GCC 12's: GLIBCXX 3.4.30, CXXABI 1.3.13).
        run: |
          app=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          dir=$(mktemp -d)
          (cd "$dir" && "$OLDPWD/$app" --appimage-extract >/dev/null)
          over=0 elfs=0
          ceiling() { # ceiling <prefix> <max> <file> <needs>
            local v
            for v in $(grep -o "^$1_[0-9.]*" <<<"$4" | sed "s/^$1_//" | sort -uV); do
              if [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | tail -n1)" != "$2" ]; then
                echo "::error::${3#"$dir"/squashfs-root/} needs $1_$v (Ubuntu 22.04 has $1_$2)"
                over=$((over + 1))
              fi
            done
          }
          highest() { grep -o "^$1_[0-9.]*" <<<"$2" | sed "s/^$1_//" | sort -uV | tail -n1; }
          all=
          while IFS= read -r -d '' f; do
            [ "$(head -c4 "$f" | od -An -c | tr -d ' ')" = '177ELF' ] || continue
            elfs=$((elfs + 1))
            needs=$(objdump -p "$f" 2>/dev/null | awk '/^Version References:/ {on=1; next} on && /^[^ \t]/ {on=0} on && NF == 4 {print $4}')
            all+="$needs"$'\n'
            ceiling GLIBC 2.35 "$f" "$needs"
            ceiling GLIBCXX 3.4.30 "$f" "$needs"
            ceiling CXXABI 1.3.13 "$f" "$needs"
          done < <(find "$dir/squashfs-root" -type f -print0)
          echo "$elfs ELF files; the highest needs: GLIBC_$(highest GLIBC "$all"), GLIBCXX_$(highest GLIBCXX "$all"), CXXABI_$(highest CXXABI "$all")"
          rm -rf "$dir"
          [ "$elfs" -gt 0 ] && [ "$over" -eq 0 ]
      - name: Build the check's probe
        if: inputs.probe
        run: |
          cargo build --release --locked -p quince-probe --example distro_check
          cp target/release/examples/distro_check target/release/bundle/appimage/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/appimage/distro_check
          if-no-files-found: error
