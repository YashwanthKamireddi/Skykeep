# Every push and pull request to main, on Linux:
#   published — what the repository tracks, the workflows' wiring, the Flatpak's sources, and
#          no secret in any commit;
#   rust — cargo fmt, clippy with warnings as errors, and the real tests (libraries, the app
#          and test files; the probe examples are live tools, not tests);
#   android — the engine for the phone, the app built and its unit tests run (job below);
#   web  — npm ci, the type check, the production build, the model tests, and a smoke run of
#          the key interface suites in Chromium against `vite preview`.
# The jobs run side by side. A pull request's newer push cancels its older run. Windows is
# built and tested by every release (windows.yml), or by hand. A branch can be run by hand
# (Actions → CI → Run workflow) before it goes to main.
name: CI

on:
  workflow_dispatch:
  # Pull requests only: a merge to main is the code its pull request checked, and every release
  # builds and tests every platform itself.
  # Every pull request runs, so `ci-ok` (below) always reports and main's ruleset can require it;
  # `scope` skips the build for a change to words or README pictures alone.
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to main cancels an older commit's run (only the newest needs checking), except a
# release commit ("Skykeep x.y.z"): it keeps a group of its own, so nothing that lands after it
# can cancel the runs its tag waits for (tag.yml). Before, every commit kept its run, and four
# merges in a row ran sixteen workflows to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || (startsWith(github.event.head_commit.message, 'Skykeep ') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Skykeep ')) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: smaller cache, faster links, same checks.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What the repository publishes: only paths .github/published-paths names (a broad `git add`
  # once published another app's installer and every local note), and no secret in any commit.
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every workflow's expressions, inputs and job wiring checked before GitHub runs them:
      # actionlint's own release, pinned and checked against its published checksum.
      - name: Workflows are well formed
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          # The workflows' wiring; their scripts' style is not this check's (-shellcheck= off).
          ./actionlint -shellcheck=
          rm actionlint actionlint.tar.gz
      - name: Nothing stray is tracked
        run: |
          stray=$(git ls-files | grep -vxE -f <(grep -vE '^(#|$)' .github/published-paths) || true)
          if [ -n "$stray" ]; then
            echo "::error::Tracked but not meant to be published (add to .github/published-paths only if it is):"
            echo "$stray"
            exit 1
          fi
      # The Flatpak builds offline from packaging/flatpak/*-sources.json; a dependency added
      # without them regenerated failed only there, at release (v0.1.18).
      - name: The Flatpak's offline sources match the lockfiles
        run: python3 packaging/flatpak/sources-current.py
      - name: No secret in any commit
        env:
          GITLEAKS: "8.30.1"
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_checksums.txt" \
            | grep " gitleaks_${GITLEAKS}_linux_x64.tar.gz$" | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact .

  # Every Rust dependency against deny.toml (cargo-deny): RustSec advisories (vulnerabilities,
  # unsound or unmaintained crates, yanked versions), licences, duplicate versions, and that
  # every crate comes from crates.io. Reads Cargo.lock and the advisory database; builds nothing.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories bans licenses sources

  # On x86_64 and on 64-bit ARM: Apple Silicon Macs run Linux (Asahi, Omarchy) on aarch64.
  # What a pull request touches decides how much runs: a translation alone (src/locales/*.json,
  # nothing else) is checked by the type checker and the language test in a minute; anything else,
  # and every push to main, runs everything below.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.files.outputs.full }}
      docs: ${{ steps.files.outputs.docs }}
      android: ${{ steps.files.outputs.android }}
      web: ${{ steps.files.outputs.web }}
      lockfiles: ${{ steps.files.outputs.lockfiles }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          full=true
          docs=false
          android=true
          web=true
          lockfiles=false
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            # Each change is checked locally before it is pushed; a pull request re-checks only
            # what it can break. The phone's build only for what the phone builds (android/, the
            # crates quince-mobile links and its bindings writer, the lockfile); the interface
            # suites only for the interface. A push to main and every release still run
            # everything, and this file changing runs both, to prove them.
            always='^\.github/workflows/ci\.yml$'
            grep -qE "$always|^android/|^crates/(quince-(auth|icloud|core|media|sync|vfs|thumbs|mobile)|uniffi-bindgen)/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$" <<< "$files" || android=false
            grep -qE "$always|^src/|^\.uiverify/|^package(-lock)?\.json$|^index\.html$|^vite\.config|^tsconfig" <<< "$files" || web=false
            # A dependency added or moved: the licence list is checked in the PR that moved it,
            # not first at the release (0.1.31's PR met five crates #160 and #170 brought).
            grep -qE '^(Cargo|package-lock)\.(lock|json)$' <<< "$files" && lockfiles=true
            # Words or README pictures alone: nothing to build or test.
            if [ -n "$files" ] && ! grep -qvE '(\.md$|^docs/media/)' <<< "$files"; then full=false; docs=true
            # Translations alone: the type check and the language test (job `languages`).
            elif [ -n "$files" ] && ! grep -qvE '^src/locales/[^/]+\.json$' <<< "$files"; then full=false
            # The repository's own wiring alone (other workflows, the release script, templates):
            # nothing of the app changed, and `published` still lints every workflow. Not when
            # this file, the test-scope script or a shared action changed: those run these jobs,
            # so the jobs run to prove them.
            elif [ -n "$files" ] && ! grep -qvE '^\.github/' <<< "$files" \
                && ! grep -qE '^\.github/(workflows/ci\.yml|scripts/test-scope\.py|actions/)' <<< "$files"; then
              full=false; docs=true; fi
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"
          echo "android=$android" | tee -a "$GITHUB_OUTPUT"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
          echo "lockfiles=$lockfiles" | tee -a "$GITHUB_OUTPUT"

  languages:
    needs: scope
    if: needs.scope.outputs.full != 'true' && needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test .uiverify/i18n.test.mjs

  # Rust and the phone: by hand only (Actions → CI → Run workflow). Each change is checked on
  # the machine it is made on before it is pushed (format, lint, the tests of what changed), and
  # every release builds and tests Linux, Windows and Android before anything is published, so
  # a break never reaches anyone. Run on every pull request too, the Rust job spent 30–50
  # minutes fetching Ubuntu's packages from a slow mirror on 18–19 Nov and held merges behind it.
  rust:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # x86_64 only on pull requests: the same tests on ARM found nothing x86_64 didn't, and
        # every release still builds and ships the ARM packages (linux.yml).
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50  # a cold cache (new toolchain, new lockfile) compiles everything; warm runs take ~12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        run: |
          printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' http://azure.archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libheif-plugin-libde265 libfuse3-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libclang-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-libav
          # The codecs, not only their headers: a video test reads an .mp4's first frames, and
          # Copy's test decodes a HEIC (libde265, which the .deb depends on too).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; pull requests read it, so they cannot crowd it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The window's files must exist for the app crate to compile (tauri::generate_context!).
      - run: npm ci --no-audit --no-fund
      # The installer build refuses a Tauri npm package and Rust crate on different minor
      # versions; caught here in seconds rather than at the end of a Windows build.
      - name: Tauri versions match
        run: |
          node -e '
            const lock = require("./package-lock.json").packages;
            const npm = lock["node_modules/@tauri-apps/api"].version;
            const rust = require("fs").readFileSync("Cargo.lock", "utf8").match(/name = "tauri"\nversion = "([^"]+)"/)[1];
            const mm = (v) => v.split(".").slice(0, 2).join(".");
            console.log(`@tauri-apps/api ${npm}, tauri crate ${rust}`);
            if (mm(npm) !== mm(rust)) { console.error("Tauri npm package and crate differ: align them"); process.exit(1); }'
      - run: npx vite build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # In a zone west of UTC with clock changes: in UTC a time read in the wrong zone reads
      # the same as the right one, so #23 (a floating reminder rang hours early) passed here.
      # The gate runs in its own machine's zone and Windows in UTC: three kinds of offset.
      # nextest (.config/nextest.toml): each test in its own process across every core, a hung
      # one stopped and failed, the slow ones named — as uv and Zed run theirs.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest
      # A pull request builds and tests the packages it changed and every package that depends
      # on them (.github/scripts/test-scope.py, cargo's own graph), as Zed's CI does; a change to
      # the lockfile, the toolchain or the CI tests everything, and so does every push to main.
      - name: What to test
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            scope=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | python3 .github/scripts/test-scope.py)
          else
            scope=all
          fi
          case "$scope" in all) sel=--workspace ;; none) sel= ;; *) sel=$(printf -- '-p %s ' $scope) ;; esac
          kinds=$(python3 .github/scripts/test-scope.py --targets $scope)
          echo "scope: $scope ($kinds)"
          { echo "scope=$scope"; echo "sel=$sel $kinds"; } >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'none'
        run: cargo nextest run ${{ steps.scope.outputs.sel }} --locked --profile ci
        env:
          TZ: America/Chicago
      # The keyring code against a real, throwaway gnome-keyring on a private bus (check.sh's
      # "real keyring"): what the keyring crate saved reads with ours, and a burst is survived.
      # The ignored tests below run through nextest with the suite's own selection, so they
      # reuse its binaries: `cargo test` built examples and doc tests again (3.6 min, 11 Nov).
      - name: A real keyring
        if: runner.arch == 'X64' && (steps.scope.outputs.scope == 'all' || contains(steps.scope.outputs.scope, 'quince-auth'))
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gnome-keyring dbus-daemon
          t=$(mktemp -d); mkdir -p "$t/data" "$t/run"; chmod 700 "$t/run"
          XDG_DATA_HOME="$t/data" XDG_RUNTIME_DIR="$t/run" dbus-run-session -- bash -c '
            echo -n throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            export QUINCE_ISOLATED_KEYRING=$DBUS_SESSION_BUS_ADDRESS
            cargo nextest run ${{ steps.scope.outputs.sel }} --locked --profile ci --run-ignored only -E "test(secret_service)"'
      # A download onto a disk that really fills up (a 1 MB tmpfs): the disk's own refusal,
      # not a made-up free-space number, stops it cleanly (folder_download/tests.rs).
      - name: A real full disk
        if: steps.scope.outputs.scope == 'all' || contains(steps.scope.outputs.scope, 'quince-app')
        run: |
          sudo mkdir -p /mnt/skykeep-full
          sudo mount -t tmpfs -o size=1m,uid=$(id -u) tmpfs /mnt/skykeep-full
          SKYKEEP_FULL_DISK=/mnt/skykeep-full cargo nextest run ${{ steps.scope.outputs.sel }} --locked --profile ci --run-ignored only -E 'test(real_full_disk)'

  # The Android app, which nothing else here builds: the engine for both ABIs (cargo-ndk) and its
  # Kotlin bindings made from that same code, the app and its device-test APK compiled, the JVM
  # unit tests run, and every engine library checked for 16 KB pages (Android 15+ devices with
  # 16 KB pages refuse a library aligned for 4 KB). The device tests themselves need an
  # emulator signed in to iCloud: they run locally (`am instrument`, never Gradle's connected
  # tasks, which uninstall the app).
  android:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Added when the bindings came from a host build of quince-mobile, which linked the desktop
      # media libraries quince-media uses on Linux. They now come from crates/uniffi-bindgen, a
      # crate of its own that builds nothing of the engine for this machine, so this step may no
      # longer be needed; drop it once a run without it is green.
      - name: Host libraries for the bindings build
        run: |
          printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' http://azure.archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends pkg-config libheif-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libclang-dev
      # The repository's own Rust (rust-toolchain.toml), with the two phone targets added to it.
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target-android"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # The engine's crate licences are written into the app at build time (about.toml).
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about@0.9.3
      - name: The app, its device tests and its unit tests
        working-directory: android
        # The runner's newest NDK (its own variable, not the workflow's env context).
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Engine libraries aligned for 16 KB pages
        run: |
          for so in android/app/src/main/jniLibs/*/*.so; do
            bad=$(readelf -lW "$so" | awk '$1 == "LOAD" && $NF != "0x4000" && $NF != "0x10000" { print $NF }')
            if [ -n "$bad" ]; then echo "::error::$so has LOAD segments aligned to $bad, not 16 KB"; exit 1; fi
            echo "$so: 16 KB"
          done

  web:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # the interface suites grew past 15 minutes; a warm run takes ~16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Model tests
        run: node --test .uiverify/*.test.mjs
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Interface smoke, in Chromium
        env:
          ENGINE: chromium
        run: |
          shots="$RUNNER_TEMP/shots"; mkdir -p "$shots"
          export TMPDIR="$shots"
          # The preview server, on every address so "localhost" answers as 127.0.0.1 or ::1.
          node node_modules/vite/bin/vite.js preview --port 4173 --strictPort --host >"$shots/preview.log" 2>&1 &
          preview=$!
          up=
          for _ in $(seq 60); do
            if ! kill -0 "$preview" 2>/dev/null; then break; fi
            if curl -sf -o /dev/null http://localhost:4173/; then up=1; break; fi
            sleep 0.5
          done
          if [ -z "$up" ]; then
            cat "$shots/preview.log"
            echo "::error::the preview server did not come up on :4173"
            exit 1
          fi
          echo "preview up"
          # The key flows, one or two per app: the window's security policy, accessibility,
          # sign-out, Skykeep's window and each app's own, and an instant write in each app.
          # check.sh refuses a name here that is not a suite it runs.
          suites="csp a11y boundary signout notes-compose notes-instant reminders-add-done
                  reminders-instant calendar-edits contacts-select drive-nav photos settings
                  app-window side-pane updates device-approval footer-refresh photos-open-on-newest photos-sort-hints"
          failed=()
          for t in $suites; do
            if node ".uiverify/$t.mjs" >"$shots/$t.log" 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"; failed+=("$t"); sed 's/^/    /' "$shots/$t.log" | tail -40
            fi
          done
          kill "$preview" 2>/dev/null || true
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-smoke
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # The one check main's ruleset requires: every job above passed or was skipped on purpose by
  # `scope`. One stable name, whatever the matrix or the scope ran (a skipped matrix job reports
  # under another name, and a required check that never reports blocks a pull request forever).
  # A release's pull request (release/x.y.z): the licence list the app shows must be the one its
  # lockfiles give, as the tag gate (tag.yml) requires. Found there, a stale list refused the tag
  # after every check had passed (0.1.27, #77); found here, it is fixed in the same pull request.
  # Other pull requests are not held to it: a dependency update stays green until the list is
  # rewritten for the release (tag.yml).
  licences:
    needs: scope
    if: startsWith(github.head_ref, 'release/') || needs.scope.outputs.lockfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about@0.9.3
      - name: Licence list current
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run licences
          if ! git diff --exit-code --stat src/licences.json; then
            echo "::error::src/licences.json is out of date: run npm run licences and commit"
            exit 1
          fi

  ci-ok:
    if: always()
    needs: [published, supply-chain, scope, languages, rust, android, web, licences]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" >/dev/null; then
            echo "::error::a check failed or was cancelled"; exit 1
          fi

