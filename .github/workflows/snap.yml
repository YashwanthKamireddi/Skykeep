# Builds the Snap from the release's .deb and checks that it installs and starts (offline, under
# a virtual display). Uploading to the Snap Store needs SNAPCRAFT_STORE_CREDENTIALS and is a
# separate step, run only when asked: by hand (publish), or by a published release (stores.yml).
name: Snap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose .deb the Snap wraps
        default: v0.1.21
      publish:
        description: Upload to the Snap Store (stable)
        type: boolean
        default: false
  # A published release (stores.yml): the same build and check, then the upload.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
  push:
    branches: [snap]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      snap: ${{ steps.name.outputs.snap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.21' }}
        run: |
          gh release download "$TAG" -p 'Skykeep_*_amd64.deb' -D snap/local
          mv snap/local/Skykeep_*_amd64.deb snap/local/skykeep.deb
          version=${TAG#v}
          sed -i "s/^version: .*/version: '$version'/" snap/snapcraft.yaml
      # Everything this build takes from the Snap Store, installed first by store-install.sh:
      # each install limited, and a hung one cleared and tried again (10 Nov: the store stopped
      # answering runners five times in a day, and a hang left snapd locked so no retry could
      # run). snapcraft then builds right here on the runner, which is Ubuntu 24.04 like the
      # snap's core24 base, instead of in an LXD container: no LXD to install, one store
      # download fewer, and the GNOME SDK it builds against is already here.
      - name: snapcraft, and the snaps it builds against
        run: |
          packaging/snap/store-install.sh snapcraft --classic
          packaging/snap/store-install.sh core24
          STORE_MINUTES=15 packaging/snap/store-install.sh gnome-46-2404-sdk
          # The GNOME extension's runtime and themes, which snapcraft would otherwise install
          # itself mid-build with no limit (10 Nov: that hung a build 20 minutes, and its
          # leftover change failed the retry). Here, each limited and cleared like the rest;
          # the install check below needs them too.
          STORE_MINUTES=15 packaging/snap/store-install.sh gnome-46-2404
          STORE_MINUTES=10 packaging/snap/store-install.sh gtk-common-themes
          STORE_MINUTES=10 packaging/snap/store-install.sh mesa-2404
      # snapcraft fetches the stage-packages from archive.ubuntu.com, which now and then stops
      # answering a runner (v0.1.16's snap failed on one .deb): a second try goes on from where
      # the first stopped. Each try is limited, so a hang is a failure and is tried again.
      - name: Build the snap
        id: pack
        run: |
          for try in 1 2; do
            if sudo timeout 1200 snapcraft pack --destructive-mode; then
              echo "snap=$(ls -1 ./*.snap | head -n1)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::snapcraft pack failed (try $try of 2)"
          done
          exit 1
      - name: The snap built
        id: build
        env:
          SNAP_FILE: ${{ steps.pack.outputs.snap }}
        run: |
          [ -f "$SNAP_FILE" ] || { echo "::error::no snap was built"; exit 1; }
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"
      - name: It installs and starts
        timeout-minutes: 20
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo apt-get install -y xvfb dbus-x11 >/dev/null
          # Snaps start only inside a user session's scope, as on a desktop; a runner step sits
          # in a system service's cgroup, so start one for this user and run inside it.
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for _ in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          set +e
          systemd-run --user --scope --quiet -- \
            timeout 20 xvfb-run -a snap run skykeep > run.log 2>&1
          code=$?
          cat run.log | tail -40
          # 124 = still running when the timeout ended it: it started and stayed up.
          [ "$code" -eq 124 ] || { echo "::error::Skykeep exited ($code) instead of staying up"; exit 1; }
      - id: name
        run: echo "snap=$(basename '${{ steps.build.outputs.snap }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skykeep-snap
          path: ${{ steps.build.outputs.snap }}

  publish:
    # Uploads the tested snap to the Snap Store's stable channel. Runs only when asked, with the
    # store credential (snapcraft export-login) saved as SNAPCRAFT_STORE_CREDENTIALS. A push to
    # the snap branch has no inputs, so it never publishes.
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: The store credential is there
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ] || { echo "::error::the SNAPCRAFT_STORE_CREDENTIALS secret is not set (snapcraft export-login)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/snap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skykeep-snap
      # snapcraft installed the patient way (see the build), then the upload, tried twice.
      - name: Upload to the stable channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ needs.build.outputs.snap }}
        run: |
          packaging/snap/store-install.sh snapcraft --classic
          for try in 1 2; do
            if timeout 900 snapcraft upload --release=stable "$SNAP_FILE"; then exit 0; fi
            echo "::warning::upload failed (try $try of 2)"
            sleep 30
          done
          exit 1
