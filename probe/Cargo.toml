[package]
name = "quince-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha1 = "0.10"
sha2 = "0.10"
anyhow.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
rpassword = "7"
jiff = "0.2.37"
base64 = "0.22"
uuid.workspace = true
flate2 = "1"
plist = "1.10"
quince-vfs = { path = "../crates/quince-vfs" }
quince-auth = { path = "../crates/quince-auth" }
quince-core = { path = "../crates/quince-core" }
quince-icloud = { path = "../crates/quince-icloud" }
quince-media = { workspace = true }

# distro_check's video check plays a file through playbin3, as the window's player does.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
