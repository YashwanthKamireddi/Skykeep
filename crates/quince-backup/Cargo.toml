[package]
name = "quince-backup"
version = "0.1.40"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Skykeep's backup and Export Everything, without a window: the engine the desktop app (src-tauri) drives, usable by other front ends too."

[dependencies]
quince-core = { path = "../quince-core" }
quince-icloud = { path = "../quince-icloud" }
quince-vfs = { path = "../quince-vfs" }
quince-sync = { path = "../quince-sync" }
# Names from a Mac saved composed (NFC), and compared so, in a folder download (folder_download.rs).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = "0.2.37"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
