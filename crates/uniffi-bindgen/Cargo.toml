[package]
# Writes the Kotlin side of the phone engine's bindings (uniffi-bindgen generate), reading the
# Android library already built. A crate of its own, as UniFFI recommends, so making the tool
# never builds the engine for the computer it runs on (and with it the desktop's keyring,
# GStreamer and libheif, which a phone build doesn't use).
name = "uniffi-bindgen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
