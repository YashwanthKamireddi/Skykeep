[package]
name = "quince-thumbs"
version = "0.1.16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A DLL File Explorer loads (the thumbnail provider), and a library Skykeep uses for the same
# pipe's name and messages, so the two sides can never disagree.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
