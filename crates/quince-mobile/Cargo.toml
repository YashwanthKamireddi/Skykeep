[package]
name = "quince-mobile"
version = "0.1.21"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Skykeep's engine for Android: the Kotlin app's one door into it, through UniFFI."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
quince-auth = { path = "../quince-auth" }
quince-icloud = { path = "../quince-icloud" }
quince-core = { path = "../quince-core" }
# Contact pictures only: cut and sized for the phone, sent at Apple's size. No HEIC (libheif
# would have to be built for Android for nothing).
quince-media = { path = "../quince-media", default-features = false }
quince-sync = { path = "../quince-sync" }
# iCloud Drive in the Files app: the desktop's file tree and write-back (writes::send), not its
# FUSE or Explorer layers, which are Linux- and Windows-only.
quince-vfs = { path = "../quince-vfs" }
serde_json.workspace = true
uuid = { workspace = true }
uniffi = "0.32"
jiff = "0.2.37"
reqwest.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
