[package]
name = "quince-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_49"] }
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }

[features]
# The stand-in phone (fakephone.rs), for tests and measurements only; never in the app.
fakephone = []

[dev-dependencies]
quince-link = { path = ".", features = ["fakephone"] }
