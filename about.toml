# Licence notices for what the apps ship (cargo-about): the Rust crates built into Skykeep, each
# with its licence text, for the apps' Open-source licences screens. Licences any GPL-3.0 app
# may ship; a crate under any other licence fails the build instead of shipping unlisted.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "Unlicense", "0BSD", "CDLA-Permissive-2.0",
  "BSL-1.0", "CC0-1.0", "LGPL-2.1-or-later", "GPL-3.0-only",
]
# Build tools and tests ship nothing.
ignore-build-dependencies = true
ignore-dev-dependencies = true
